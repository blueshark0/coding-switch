# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "Portico"
arch: ${GOARCH}
platform: "linux"
version: "1.0.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Manage Claude & Codex relays, providers, and request logs."
vendor: "Portico"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/Portico"
    dst: "/usr/local/bin/Portico"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/Portico.png"
  - src: "./build/linux/Portico.desktop"
    dst: "/usr/share/applications/Portico.desktop"

# Default dependencies for Debian/Ubuntu with GTK4 and WebKitGTK 6.0
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-0

# Distribution-specific overrides for GTK4 and WebKitGTK 6.0
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

